<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bitter:wght@600;700&display=swap">
<style>
/* Layout: one phone-sized column. A slim header with her running tally, one large card in the middle, three tabs along the bottom. */
:root {
  --bg: #fff6fa;
  --glow-1: rgba(255, 158, 200, 0.40);
  --glow-2: rgba(255, 205, 178, 0.32);
  --glow-3: rgba(216, 184, 255, 0.30);
  --surface: rgba(255, 255, 255, 0.55);
  --glass-edge: rgba(255, 255, 255, 0.9);
  --glass-shadow: 0 10px 34px rgba(190, 70, 130, 0.13);
  --veil: rgba(255, 244, 249, 0.74);
  --field: rgba(255, 255, 255, 0.72);
  --ink: #1d1b3a;
  --muted: #5c5470;
  --line: rgba(110, 50, 90, 0.2);
  --brand: #ad1f6b;
  --brand-2: #c93482;
  --brand-glow: rgba(200, 50, 130, 0.28);
  --brand-ink: #ffffff;
  --brand-text: #96185c;
  --accent: #e2579c;
  --answer-bg: rgba(255, 255, 255, 0.62);
  --good: #1c7046;
  --good-bg: #dcf2e6;
  --on-good: #ffffff;
  --learn: #8a5200;
  --learn-bg: #fcefd4;
  --miss: #a8321a;
  --miss-bg: #fce8e3;
  --font-display: "Bitter", Georgia, "Times New Roman", serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #170f1e; --glow-1: rgba(226, 72, 150, 0.30); --glow-2: rgba(255, 140, 120, 0.13); --glow-3: rgba(130, 84, 220, 0.24); --surface: rgba(255, 255, 255, 0.07); --glass-edge: rgba(255, 255, 255, 0.16); --glass-shadow: 0 10px 34px rgba(0, 0, 0, 0.35); --veil: rgba(23, 15, 30, 0.74); --field: rgba(255, 255, 255, 0.09); --ink: #f7eef6; --muted: #c6b6ca; --line: rgba(255, 255, 255, 0.18);
    --brand: #ff8fc6; --brand-2: #ffb1d8; --brand-glow: rgba(255, 110, 180, 0.25); --brand-ink: #2b0f20; --brand-text: #ffabd4; --accent: #ff7ab8; --answer-bg: rgba(255, 255, 255, 0.08);
    --good: #72d3a2; --good-bg: #143526; --on-good: #0d1524; --learn: #f2c166; --learn-bg: #3a2c10; --miss: #ffa093; --miss-bg: #3f1b16;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #170f1e; --glow-1: rgba(226, 72, 150, 0.30); --glow-2: rgba(255, 140, 120, 0.13); --glow-3: rgba(130, 84, 220, 0.24); --surface: rgba(255, 255, 255, 0.07); --glass-edge: rgba(255, 255, 255, 0.16); --glass-shadow: 0 10px 34px rgba(0, 0, 0, 0.35); --veil: rgba(23, 15, 30, 0.74); --field: rgba(255, 255, 255, 0.09); --ink: #f7eef6; --muted: #c6b6ca; --line: rgba(255, 255, 255, 0.18);
  --brand: #ff8fc6; --brand-2: #ffb1d8; --brand-glow: rgba(255, 110, 180, 0.25); --brand-ink: #2b0f20; --brand-text: #ffabd4; --accent: #ff7ab8; --answer-bg: rgba(255, 255, 255, 0.08);
  --good: #72d3a2; --good-bg: #143526; --on-good: #0d1524; --learn: #f2c166; --learn-bg: #3a2c10; --miss: #ffa093; --miss-bg: #3f1b16;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background:
    radial-gradient(70% 46% at 8% 0%, var(--glow-1), transparent 72%),
    radial-gradient(60% 42% at 100% 34%, var(--glow-2), transparent 72%),
    radial-gradient(80% 50% at 40% 100%, var(--glow-3), transparent 72%),
    var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 18px;
  line-height: 1.45;
}
.app { height: 100%; max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.top { padding-block: 12px 10px; display: flex; flex-direction: column; gap: 8px; }
.top-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.top h1 { font-family: var(--font-display); font-size: 1.2rem; line-height: 1.2; margin: 0; }
.tally { color: var(--muted); font-size: 0.95rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--brand)); border-radius: 3px; }

main { flex: 1; min-height: 0; overflow-y: auto; padding-block: 4px 0; scroll-padding-bottom: 250px; }
.view { display: flex; flex-direction: column; gap: 14px; padding-bottom: 16px; }

.tabs {
  display: flex; background: var(--surface); border-top: 1px solid var(--glass-edge);
  -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%);
}
.tabs button {
  flex: 1; min-width: 0; min-height: 60px; padding: 6px 4px;
  font: inherit; font-weight: 700; font-size: 1rem;
  color: var(--muted); background: none; border: 0; border-top: 4px solid transparent; cursor: pointer;
}
.tabs button[aria-selected="true"] { color: var(--brand-text); border-top-color: var(--accent); }

:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

h2, h3, p { margin: 0; }
.title { font-family: var(--font-display); font-size: 1.5rem; line-height: 1.2; text-wrap: balance; }
.muted { color: var(--muted); }
.small { font-size: 0.95rem; }

.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.controls select { flex: 1 1 220px; min-width: 0; }
select, input[type="text"] {
  font: inherit; color: var(--ink); background: var(--field);
  border: 1px solid var(--line); border-radius: 14px;
  min-height: 50px; padding: 8px 12px; max-width: 100%; width: 100%;
}
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; }
.check input { width: 24px; height: 24px; accent-color: var(--brand); flex: none; }

.card {
  background: var(--surface); border: 1px solid var(--glass-edge); border-radius: 22px;
  box-shadow: var(--glass-shadow);
  -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%);
  padding: 18px; display: flex; flex-direction: column; gap: 14px;
}
.meta { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.meta span:last-child { text-align: right; }
.q { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.4rem, 5.8vw, 1.8rem); line-height: 1.25; text-wrap: balance; }
.listen {
  align-self: flex-start; display: inline-flex; align-items: center; gap: 8px;
  min-height: 46px; padding: 6px 14px 6px 10px; border-radius: 23px;
  font: inherit; font-size: 1rem; font-weight: 700;
  color: var(--brand-text); background: var(--field); border: 1px solid var(--glass-edge); cursor: pointer;
  box-shadow: 0 2px 10px var(--brand-glow);
}
.listen svg { width: 24px; height: 24px; flex: none; }
.answer-block { display: flex; flex-direction: column; gap: 10px; border-top: 2px solid var(--accent); padding-top: 14px; }
.label { font-size: 0.85rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.answers { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.answers li { background: var(--answer-bg); border-radius: 8px; padding: 9px 12px; font-size: 1.2rem; line-height: 1.3; overflow-wrap: anywhere; }
.note { background: var(--learn-bg); color: var(--learn); border-radius: 8px; padding: 10px 12px; font-size: 0.98rem; }
@media (prefers-reduced-motion: no-preference) {
  .answer-block { animation: reveal 0.22s ease-out; }
  @keyframes reveal { from { opacity: 0.2; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}

.actions {
  position: sticky; bottom: 0; display: flex; flex-direction: column; gap: 8px;
  margin-inline: -8px; padding: 10px 8px; border-radius: 20px 20px 0 0;
  background: var(--veil); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
.row { display: flex; gap: 10px; }
.row > .btn { flex: 1; min-width: 0; }
.btn {
  min-height: 58px; padding: 10px 14px; border-radius: 12px; border: 2px solid transparent;
  font: inherit; font-weight: 700; font-size: 1.1rem; line-height: 1.2; cursor: pointer;
}
.btn { border-radius: 16px; }
.btn.primary { background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: var(--brand-ink); box-shadow: 0 6px 18px var(--brand-glow); }
.btn.with-icon { display: flex; align-items: center; justify-content: center; gap: 10px; }
.btn.with-icon svg { width: 26px; height: 26px; flex: none; }
.btn.good { background: var(--good); color: var(--on-good); }
.btn.learn { background: var(--learn-bg); color: var(--learn); border-color: var(--learn); }
.btn.miss { background: var(--miss-bg); color: var(--miss); border-color: var(--miss); }
.btn.quiet { background: var(--field); color: var(--brand-text); border-color: var(--line); }

.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 58px; padding: 10px 14px;
  font: inherit; font-size: 1.1rem; line-height: 1.3; text-align: left; color: var(--ink);
  background: var(--field); border: 2px solid var(--line); border-radius: 16px; cursor: pointer;
}
.opt .letter {
  flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
  font-weight: 700; font-size: 0.95rem; color: var(--brand-text); border: 2px solid var(--line);
}
.opt .opt-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.opt .mark { flex: none; font-weight: 700; font-size: 1.3rem; }
.opt:disabled { color: var(--ink); cursor: default; }
.opt:disabled:not(.right):not(.wrong) { opacity: 0.55; }
.opt.right { background: var(--good-bg); border-color: var(--good); }
.opt.right .mark, .opt.right .letter { color: var(--good); border-color: var(--good); }
.opt.wrong { background: var(--miss-bg); border-color: var(--miss); }
.opt.wrong .mark, .opt.wrong .letter { color: var(--miss); border-color: var(--miss); }
.result-line { font-family: var(--font-display); font-size: 1.3rem; line-height: 1.25; }
.result-line.ok { color: var(--good); }
.result-line.no { color: var(--miss); }
.result-line.almost { color: var(--learn); }
.answer-box {
  display: block; width: 100%; min-height: 96px; resize: vertical; padding: 12px 14px;
  font: inherit; font-size: 1.2rem; line-height: 1.35; color: var(--ink);
  background: var(--field); border: 2px solid var(--accent); border-radius: 16px;
}
.answer-box::placeholder { color: var(--muted); }
.row > .btn.with-icon.slim svg { width: 22px; height: 22px; }
.label.listening { display: flex; align-items: center; gap: 10px; color: var(--brand-text); }
.label.listening::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
@media (prefers-reduced-motion: no-preference) {
  .label.listening::before { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.6); opacity: 0.4; } }
}
.heard { display: flex; flex-direction: column; gap: 6px; border-top: 2px solid var(--accent); padding-top: 14px; }
.heard-text { font-size: 1.2rem; min-height: 1.6em; }
.btn.slim { min-height: 46px; font-size: 1rem; }

.score { display: flex; flex-direction: column; gap: 10px; }
.score-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.score-line b { min-width: 5.2em; font-variant-numeric: tabular-nums; }
.pips { display: flex; gap: 5px; flex-wrap: wrap; }
.pip { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--line); }
.pip.good.on { background: var(--good); border-color: var(--good); }
.pip.miss.on { background: var(--miss); border-color: var(--miss); }

.verdict { font-family: var(--font-display); font-size: 2rem; line-height: 1.1; }
.verdict.pass { color: var(--good); }
.verdict.fail { color: var(--miss); }
.missed { display: flex; flex-direction: column; gap: 14px; }
.missed h3 { font-size: 1.05rem; line-height: 1.3; }
.missed p { color: var(--muted); }

.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 700; line-height: 1.3; }
.saved { color: var(--good); font-weight: 700; font-size: 0.95rem; }
.fine { color: var(--muted); font-size: 0.9rem; }
a { color: var(--brand-text); }
</style>

<div class="app">
  <header class="top gutter">
    <div class="top-row">
      <h1>Civics Cards</h1>

  </nav>
</div>

    document.getElementById('tab-' + v).setAttribute('aria-selected', String(v === view));
  }
  stopSpeak();
  stopListening();
  if (view === 'study') renderStudy();
  if (view === 'test') renderTest();
  if (view === 'names') { confirmErase = false; renderNames(); }
  mainEl.scrollTop = 0;
}
for (const v of ['study', 'test', 'names']) {
  document.getElementById('tab-' + v).addEventListener('click', () => show(v));
}

/* ---------- start ---------- */
buildDeckOptions();
mixBox.checked = !!store.mix;
mixBox.addEventListener('change', () => { store.mix = mixBox.checked; save(); startStudy(study.deck); });
deckSel.addEventListener('change', () => startStudy(deckSel.value));
updateTally();
(function () {
  const seen = Object.keys(store.status).length;
  const unseen = deckList('new').length;
  startStudy(seen > 0 && unseen > 0 ? 'new' : unseen === 0 && deckList('learning').length > 0 ? 'learning' : 'all');
})();
</script>
